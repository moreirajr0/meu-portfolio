<meta charset="UTF-8">

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #cdecfb;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .logo {
        display: flex;
        justify-content: center;
        padding: 0px 0px;
        background-color: #cdecfb;
    }

    .logo img {
        max-width: 200px;
        height: auto;
    }

    main {
        width: 100%;
        margin: 0;
        padding: 0px 0px 0px 0px;
        align-items: center;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-color: #cdecfb;
    }

    .carousel {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        /* limite máximo opcional */
        margin: 0 auto;
        flex: 1 1 100%;
        /* permite encolher e crescer */
    }

    .slides {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .slides img {
        flex: 1 1 auto;
        /* faz a imagem se ajustar como os blocos */
        width: 100%;
        height: auto;
        /* mantém proporção */
        max-width: 100%;
        min-width: 200px;
        /* evita que fique minúscula demais */
        display: none;
    }

    .slides img.active {
        display: block;
    }


    .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(255, 255, 255, 0.7);
        border: none;
        cursor: pointer;
        font-size: 24px;
        padding: 10px;
        color: #003e51;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .left {
        left: 10px;
    }

    .right {
        right: 10px;
    }

    .blocks {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        margin: 0;
        padding: 0px;
        max-width: 100%;
        gap: 10px;
        /* espaçamento entre os blocos */
    }

    .block {
        flex: 1 1 18%;
        /* permite encolher e crescer com a tela */
        max-width: 220px;
        /* largura máxima opcional */
        min-width: 150px;
        /* largura mínima para não quebrar layout */
        text-align: center;
        margin: 5px;
        background-color: #cdecfb;
    }

    .banner img {
        width: 100%;
        height: auto;
        background-color: #cdecfb;
    }

    .qr-code {
        display: flex;
        justify-content: center;
        margin-top: 10px;
        /* Espaço entre o banner e o QR Code */
    }

    .qr-code img {
        max-width: 100%;
        /* Ajusta a largura máxima do QR Code */
        height: auto;
        /* Mantém a proporção do QR Code */
    }

    .cta {
        padding: 10px;
        border: 2px solid #cdecfb;
        color: #003e51;
        background-color: #cdecfb;
        border-radius: 5px;
        cursor: pointer;
        width: 80%;
        margin: 10px auto;
        display: block;
        text-align: center;
        text-decoration: none;
    }

    @media (max-width: 1024px) {
        .block {
            flex: 1 1 22%;
        }
    }

    @media (max-width: 768px) {
        .block {
            flex: 1 1 45%;
        }
    }

    @media (max-width: 480px) {
        .block {
            flex: 1 1 90%;
        }

        .arrow {
            top: 22%;
            /* sobe um pouco no mobile */
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            font-size: 20px;
            padding: 8px;
        }

        .qrcode {
            display: none;
        }
    }
</style>

<script>
    let currentSlide = 0;

    function showSlide(index) {
        const slides = document.querySelectorAll('.slides img');
        slides.forEach((slide, i) => {
            slide.classList.remove('active');
            if (i === index) {
                slide.classList.add('active');
            }
        });
    }

    function nextSlide() {
        const slides = document.querySelectorAll('.slides img');
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function prevSlide() {
        const slides = document.querySelectorAll('.slides img');
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        showSlide(currentSlide);
    }

    // Inicializa o primeiro slide
    showSlide(currentSlide);
</script>
